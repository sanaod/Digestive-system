<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="palestineGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#007a3d" />
      <stop offset="50%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#ce1126" />
    </linearGradient>

    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>

    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Outer Ring Emblem -->
  <circle cx="250" cy="250" r="235" fill="#0f172a" stroke="url(#goldGrad)" stroke-width="8" filter="url(#shadow)" />
  <circle cx="250" cy="250" r="220" fill="none" stroke="#1e293b" stroke-width="3" />

  <!-- Palestinian Flag Motif Banner (Top Arc & Triangle) -->
  <path d="M 120 180 L 250 80 L 380 180 Z" fill="#ce1126" opacity="0.95" />
  <!-- Black band top -->
  <path d="M 60 210 Q 250 140 440 210" fill="none" stroke="#000000" stroke-width="12" stroke-linecap="round" />
  <!-- Green band bottom -->
  <path d="M 60 290 Q 250 360 440 290" fill="none" stroke="#007a3d" stroke-width="12" stroke-linecap="round" />

  <!-- Open Book of Knowledge in Center -->
  <g transform="translate(150, 190)">
    <!-- Left page -->
    <path d="M 100 80 Q 50 60 0 70 L 0 150 Q 50 140 100 160 Z" fill="#f8fafc" stroke="#cbd5e1" stroke-width="3" />
    <!-- Right page -->
    <path d="M 100 80 Q 150 60 200 70 L 200 150 Q 150 140 100 160 Z" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="3" />
    <!-- Spine -->
    <path d="M 100 80 L 100 160" stroke="#0f172a" stroke-width="4" stroke-linecap="round" />

    <!-- Lines of Knowledge -->
    <line x1="20" y1="95" x2="80" y2="90" stroke="#10b981" stroke-width="3" stroke-linecap="round" />
    <line x1="20" y1="115" x2="80" y2="110" stroke="#0284c7" stroke-width="3" stroke-linecap="round" />
    <line x1="20" y1="135" x2="70" y2="130" stroke="#64748b" stroke-width="3" stroke-linecap="round" />

    <line x1="120" y1="90" x2="180" y2="95" stroke="#10b981" stroke-width="3" stroke-linecap="round" />
    <line x1="120" y1="110" x2="180" y2="115" stroke="#0284c7" stroke-width="3" stroke-linecap="round" />
    <line x1="130" y1="130" x2="180" y2="135" stroke="#64748b" stroke-width="3" stroke-linecap="round" />
  </g>

  <!-- Olive Branch Symbol of Peace & Palestine -->
  <g transform="translate(250, 160)" fill="#10b981">
    <circle cx="-30" cy="-10" r="7" />
    <circle cx="-15" cy="-25" r="7" />
    <circle cx="0" cy="-32" r="8" fill="#f59e0b" />
    <circle cx="15" cy="-25" r="7" />
    <circle cx="30" cy="-10" r="7" />
    <path d="M -40 0 Q 0 -45 40 0" fill="none" stroke="#047857" stroke-width="3" />
  </g>

  <!-- Creative Commons CC Badge Seal -->
  <g transform="translate(250, 375)">
    <rect x="-65" y="-18" width="130" height="36" rx="18" fill="#1e293b" stroke="#f59e0b" stroke-width="2" />
    <text x="0" y="5" font-family="'Cairo', 'Tajawal', sans-serif" font-weight="800" font-size="14" fill="#f59e0b" text-anchor="middle">
      CC BY-NC-SA 4.0
    </text>
  </g>

  <!-- Main Teacher Name Arc / Banner Text -->
  <text x="250" y="115" font-family="'Cairo', 'Tajawal', sans-serif" font-weight="900" font-size="22" fill="#ffffff" text-anchor="middle">
    الأستاذ عبد الرحمن دويكات
  </text>

  <text x="250" y="142" font-family="'Cairo', 'Tajawal', sans-serif" font-weight="700" font-size="14" fill="#38bdf8" text-anchor="middle">
    مصادر التعليم المفتوحة OER
  </text>

  <!-- Subtitle Text -->
  <text x="250" y="425" font-family="'Cairo', 'Tajawal', sans-serif" font-weight="800" font-size="16" fill="#10b981" text-anchor="middle">
    العلوم والحياة – المنهاج الفلسطيني
  </text>
  <text x="250" y="448" font-family="'Cairo', 'Tajawal', sans-serif" font-weight="600" font-size="13" fill="#94a3b8" text-anchor="middle">
    الصف الرابع الأساسي
  </text>
</svg>
